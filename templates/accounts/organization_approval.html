{% extends 'base.html' %}{% block title %}Approvals{% endblock %}{% block content %}<div class="section"><h1>Organization approvals</h1>{% for org in organizations %}<div class="card"><h3>{{ org.name }}</h3><p>{{ org.description }}</p><form method="post">{% csrf_token %}<input type="hidden" name="org_id" value="{{ org.id }}"><button class="button" name="decision" value="approved">Approve</button> <button class="button danger" name="decision" value="rejected">Reject</button></form></div>{empty}<p>No pending organizations.</p>{% endfor %}</div>{% endblock %}
