{% extends 'base.html' %}{% block title %}Create an account{% endblock %}{% block content %}
<div class="form-card">
  <div class="form-card__head">
    <h1>Join VolunteerConnect</h1>
    <p class="muted">One account to apply as a volunteer. Coordinators register their organization after signing up.</p>
  </div>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <button class="btn btn--primary" type="submit">Create account</button>
  </form>
  <p class="form-card__foot">Already have an account? <a class="link" href="{% url 'login' %}">Sign in</a></p>
</div>
{% endblock %}
