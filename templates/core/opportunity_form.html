{% extends 'base.html' %}{% block title %}{{ title }}{% endblock %}{% block content %}
<div class="form-card">
  <div class="form-card__head">
    <h1>{{ title }}</h1>
    <p class="muted">Volunteers see the title, date, location and places left before they apply.</p>
  </div>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <div class="actions">
      <button class="btn btn--primary" type="submit">Save opportunity</button>
      <a class="btn btn--ghost" href="{% url 'dashboard' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
