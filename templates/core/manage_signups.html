{% extends 'base.html' %}{% block title %}Applications{% endblock %}{% block content %}<div class="section"><h1>Applications for {{ opportunity.title }}</h1>{% for signup in signups %}<div class="card"><strong>{{ signup.volunteer.username }}</strong> · {{ signup.status }}<form method="post">{% csrf_token %}<input type="hidden" name="signup_id" value="{{ signup.id }}"><button class="button" name="decision" value="confirmed">Confirm</button> <button class="button danger" name="decision" value="rejected">Reject</button></form></div>{empty}<p>No applications.</p>{% endfor %}</div>{% endblock %}
