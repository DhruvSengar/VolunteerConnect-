{% extends 'base.html' %}{% block title %}Log hours{% endblock %}{% block content %}
<div class="form-card">
  <div class="form-card__head">
    <p class="eyebrow">{{ signup.opportunity.title }}</p>
    <h1>Log your hours</h1>
    <p class="muted">The coordinator checks this entry. Verified hours count towards your certificates.</p>
  </div>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <button class="btn btn--primary" type="submit">Send for verification</button>
  </form>
</div>
{% endblock %}
